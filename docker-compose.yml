version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: marketplace-mysql
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace_secret
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: marketplace-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
